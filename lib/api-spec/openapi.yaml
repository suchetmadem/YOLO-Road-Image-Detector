openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: detection
    description: Road image obstacle detection
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /detect:
    post:
      operationId: detectRoadImage
      tags: [detection]
      summary: Detect cars and trucks in a road image
      description: Runs the supplied YOLO model and returns a boxed image with detection counts.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RoadImageInput"
      responses:
        "200":
          description: Detection result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RoadImageDetection"
        "400":
          description: Invalid image input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Model inference failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    RoadImageInput:
      type: object
      properties:
        imageDataUrl:
          type: string
          minLength: 32
          description: A base64-encoded image data URL.
        filename:
          type: string
          description: Original filename, used only for display and diagnostics.
      required:
        - imageDataUrl
    Detection:
      type: object
      properties:
        label:
          type: string
        confidence:
          type: number
          minimum: 0
          maximum: 1
      required:
        - label
        - confidence
    RoadImageDetection:
      type: object
      properties:
        imageDataUrl:
          type: string
          description: The original image with YOLO bounding boxes.
        cars:
          type: integer
          minimum: 0
        trucks:
          type: integer
          minimum: 0
        detections:
          type: array
          items:
            $ref: "#/components/schemas/Detection"
      required:
        - imageDataUrl
        - cars
        - trucks
        - detections
    ErrorResponse:
      type: object
      properties:
        error:
          type: string
      required:
        - error

